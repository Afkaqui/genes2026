services:
  genes-intranet-api:
    build: .
    container_name: genes_intranet_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - default
      - postgresql_default

networks:
  postgresql_default:
    external: true
